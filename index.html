<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi Voice AI Studio</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070b16;
  --panel:#0d1424;
  --panel2:#111a2e;
  --border:#26324d;
  --text:#f8fafc;
  --muted:#94a3b8;
  --cyan:#22d3ee;
  --purple:#8b5cf6;
  --green:#22c55e;
  --red:#ef4444;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 75% 10%,#182755 0,transparent 30%),
    radial-gradient(circle at 20% 90%,#15163b 0,transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

button,select,textarea,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:235px;
  padding:22px 16px;
  border-right:1px solid var(--border);
  background:rgba(7,11,22,.88);
  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:800;
  margin-bottom:30px;
}

.brandIcon{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
}

.sectionTitle{
  color:var(--cyan);
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  margin:20px 10px 8px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.nav button{
  border:0;
  background:transparent;
  color:#cbd5e1;
  text-align:left;
  padding:12px;
  border-radius:10px;
}

.nav button:hover,
.nav button.active{
  background:#18243b;
  color:white;
}

.project{
  margin-top:18px;
  width:100%;
  border:1px solid #4c1d95;
  background:#17102b;
  color:#d8b4fe;
  padding:11px;
  border-radius:10px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
}

.topbar{
  height:72px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:15px;
  padding:0 25px;
}

.search{
  width:min(350px,45%);
  background:#111827;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 15px;
  color:white;
  outline:none;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  font-weight:bold;
}

.content{
  max-width:1400px;
  margin:auto;
  padding:28px;
}

.workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:22px;
}

.card{
  background:rgba(13,20,36,.88);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
  box-shadow:0 18px 50px rgba(0,0,0,.2);
}

.titleRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.titleRow h1{
  margin:0;
  font-size:25px;
}

.live{
  color:#67e8f9;
  font-size:12px;
  padding:6px 10px;
  border:1px solid #155e75;
  border-radius:20px;
}

/* SCRIPT */

textarea{
  width:100%;
  min-height:190px;
  resize:vertical;
  border:1px solid #35415e;
  border-radius:14px;
  padding:17px;
  color:white;
  background:#090f1d;
  outline:none;
  line-height:1.6;
}

textarea:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(34,211,238,.08);
}

.meta{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
}

/* CONTROLS */

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:18px;
}

.field label{
  display:block;
  color:#cbd5e1;
  font-size:13px;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:12px;
  border-radius:11px;
  border:1px solid #35415e;
  background:#0b1220;
  color:white;
  outline:none;
}

.rangeBox{
  background:#0b1220;
  border:1px solid #35415e;
  padding:11px 13px;
  border-radius:11px;
}

input[type=range]{
  width:100%;
  accent-color:var(--cyan);
}

/* VOICES */

.voiceTitle{
  margin:24px 0 12px;
  font-size:19px;
  font-weight:800;
}

.voices{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.voice{
  min-height:135px;
  border:1px solid #334155;
  background:#0b1220;
  border-radius:14px;
  color:white;
  padding:14px;
  text-align:left;
  transition:.2s;
}

.voice:hover{
  transform:translateY(-2px);
}

.voice.selected{
  border-color:var(--cyan);
  box-shadow:0 0 20px rgba(34,211,238,.13);
}

.face{
  width:48px;
  height:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:25px;
  background:#26334d;
  margin-bottom:8px;
}

.voiceName{
  font-weight:800;
}

.voiceDesc{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.badge{
  display:inline-block;
  margin-top:8px;
  font-size:9px;
  color:#67e8f9;
}

/* BUTTONS */

.actions{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  margin-top:18px;
}

.btn{
  border:0;
  border-radius:12px;
  padding:14px;
  color:white;
  font-weight:800;
}

.generate{
  background:linear-gradient(135deg,#16a34a,#22c55e);
}

.stop{
  background:linear-gradient(135deg,#dc2626,#ef4444);
}

/* OUTPUT */

.outputTitle{
  font-size:19px;
  font-weight:800;
  margin-bottom:4px;
}

.outputSub{
  color:var(--cyan);
  font-size:12px;
  margin-bottom:15px;
}

.wave{
  height:150px;
  border:1px solid #26324d;
  border-radius:14px;
  background:#080d18;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  overflow:hidden;
}

.bar{
  width:4px;
  border-radius:4px;
  background:linear-gradient(var(--cyan),var(--purple));
  height:20px;
  animation:none;
}

.wave.playing .bar{
  animation:wave .7s infinite alternate ease-in-out;
}

.bar:nth-child(2n){animation-delay:.1s}
.bar:nth-child(3n){animation-delay:.2s}
.bar:nth-child(4n){animation-delay:.3s}

@keyframes wave{
  from{height:12px}
  to{height:85px}
}

.player{
  margin-top:15px;
}

.progress{
  width:100%;
  height:5px;
  background:#26324d;
  border-radius:5px;
  overflow:hidden;
}

.progressFill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
}

.playerControls{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:12px;
}

.circleBtn{
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid #334155;
  background:#111827;
  color:white;
}

.playMain{
  background:var(--cyan);
  color:#06111b;
}

.duration{
  margin-left:auto;
  color:var(--muted);
  font-size:12px;
}

.outputInfo{
  color:var(--muted);
  font-size:11px;
  margin-top:12px;
}

.download{
  width:100%;
  margin-top:15px;
  background:linear-gradient(135deg,#06b6d4,#8b5cf6);
}

.download:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#0b1220;
  border:1px solid #26324d;
  color:#cbd5e1;
  font-size:12px;
}

/* MOBILE */

@media(max-width:950px){

  .sidebar{
    display:none;
  }

  .workspace{
    grid-template-columns:1fr;
  }

  .topbar{
    height:60px;
  }

  .content{
    padding:15px;
  }
}

@media(max-width:600px){

  .search{
    display:none;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .voices{
    grid-template-columns:1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }

  .content{
    padding:10px;
  }

  .card{
    padding:15px;
    border-radius:15px;
  }

  .titleRow h1{
    font-size:21px;
  }
}
</style>
</head>


<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">
      <div class="brandIcon">✦</div>
      VOICE.AI
    </div>

    <div class="sectionTitle">QUICK ACCESS</div>

    <div class="nav">
      <button class="active">⌂ Home</button>
      <button>◉ Voices</button>
      <button>◈ Voice Cloning</button>
      <button>▣ Projects</button>
      <button>☆ Favorites</button>
      <button>⌁ Analytics</button>
    </div>

    <div class="sectionTitle">PROJECTS</div>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <input
        class="search"
        placeholder="Search voices, projects..."
      >

    </header>


    <div class="content">

      <div class="workspace">

        <!-- GENERATOR -->

        <section class="card">

          <div class="titleRow">

            <h1>
              AI Voice Generator
            </h1>

            <span class="live">
              ● LIVE
            </span>

          </div>


          <textarea
            id="script"
            placeholder="Enter your Hindi script here..."
          >अगर आप सफल होना चाहते हैं, तो सिर्फ सपने देखना काफी नहीं है। हर दिन कुछ नया सीखिए, अपनी skills को बेहतर बनाइए और अपने समय का सही इस्तेमाल कीजिए।</textarea>


          <div class="meta">

            <span>
              Hindi speech • India
            </span>

            <span id="count">
              0 characters
            </span>

          </div>


          <!-- CONTROLS -->

          <div class="controls">

            <div class="field">

              <label>Language</label>

              <select id="language">

                <option value="hi-IN">
                  Hindi (India)
                </option>

                <option value="hi">
                  Hindi
                </option>

              </select>

            </div>


            <div class="field">

              <label>Voice</label>

              <select id="voiceSelect">

                <option value="">
                  Select Hindi voice
                </option>

              </select>

            </div>


            <div class="field">

              <label>Speaking Speed</label>

              <div class="rangeBox">

                <input
                  id="rate"
                  type="range"
                  min=".6"
                  max="1.4"
                  step=".05"
                  value=".95"
                >

                <span id="rateValue">
                  0.95x
                </span>

              </div>

            </div>


            <div class="field">

              <label>Voice Pitch</label>

              <div class="rangeBox">

                <input
                  id="pitch"
                  type="range"
                  min=".6"
                  max="1.4"
                  step=".05"
                  value="1"
                >

                <span id="pitchValue">
                  1.00
                </span>

              </div>

            </div>

          </div>


          <!-- VOICE SELECTION -->

          <div class="voiceTitle">
            Voice Selection
          </div>

          <div class="voices">

            <button
              class="voice selected"
              data-gender="male"
              data-name="Indian Male"
            >

              <div class="face">👨🏻</div>

              <div class="voiceName">
                Indian Male
              </div>

              <div class="voiceDesc">
                Deep • Natural • Professional
              </div>

              <span class="badge">
                HINDI • INDIA
              </span>

            </button>


            <button
              class="voice"
              data-gender="female"
              data-name="Indian Female"
            >

              <div class="face">👩🏻</div>

              <div class="voiceName">
                Indian Female
              </div>

              <div class="voiceDesc">
                Natural • Clear • Warm
              </div>

              <span class="badge">
                HINDI • INDIA
              </span>

            </button>


            <button
              class="voice"
              data-gender="custom"
              data-name="My Voice"
            >

              <div class="face">🎙️</div>

              <div class="voiceName">
                My Voice
              </div>

              <div class="voiceDesc">
                Your custom voice
              </div>

              <span class="badge">
                VOICE CLONING
              </span>

            </button>

          </div>


          <!-- ACTIONS -->

          <div class="actions">

            <button

            <button

          <div

            Ready • Select a Hindi voice and generate.
          </div>

        </section>


        <!-- OUTPUT -->

        <aside class="card">

          <div class="outputTitle">
            Audio Output
          </div>

          <div class="outputSub">
            Real-time Waveform

          <div
            class="wave"
            id="wave"
          >

            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>

          </div>


          <div class="player">

            <div class="progress">

              <div
                class="progressFill"
                id="progressFill">
              </div>

            </div>


            <div class="playerControls">

              <button
                class="circleBtn"
                id="backBtn">
                ◀
              </button>

                id="playBtn">
                ▶
              </button>

                class="circleBtn"
                id="forwardBtn">
                ▶

                class="duration"

              </span>

          </div>


          <div class="outputInfo">

            Quality: 24 kHz • 16-bit
          </div>


          <button
            class="btn download"
            id="downloadMP3"
            disabled

            ↓ Export MP3
          </button>


          <button
            class="btn download"
            id="downloadWAV"
            disabled
          >
            ↓ Export WAV
          </button>


          <!-- REAL AUDIO ELEMENT -->

          <audio
            id="audio"
            controls
            style="width:100%;margin-top:14px;display:none;">
          </audio>

        </aside>

      </div>

    </div>

  </main>

</div>


<script>

/* ============================================================
   HINDI VOICE AI STUDIO
   FRONTEND ENGINE

   1. Browser Preview:
      Uses available Hindi browser voice.

   2. Real AI TTS:
      Sends request to:
      /api/tts

      Expected backend response:
      audio/mpeg OR audio/wav

   3. Returned audio becomes downloadable.
   ============================================================ */


const scriptBox =
  document.getElementById("script");

const count =
  document.getElementById("count");

const voiceSelect =
  document.getElementById("voiceSelect");

const language =
  document.getElementById("language");

const rate =
  document.getElementById("rate");

const pitch =
  document.getElementById("pitch");

const rateValue =
  document.getElementById("rateValue");

const pitchValue =
  document.getElementById("pitchValue");

const generate =
  document.getElementById("generate");

const stop =
  document.getElementById("stop");

const status =
  document.getElementById("status");

const wave =
  document.getElementById("wave");

const audio =
  document.getElementById("audio");

const playBtn =
  document.getElementById("playBtn");

const progressFill =
  document.getElementById("progressFill");

const duration =
  document.getElementById("duration");

const downloadMP3 =
  document.getElementById("downloadMP3");

const downloadWAV =
  document.getElementById("downloadWAV");


let browserVoices = [];

let selectedGender =
  "male";

let generatedBlob =
  null;


/* ============================================================
   CHARACTER COUNTER
   ============================================================ */

function updateCount(){

  count.textContent =
    scriptBox.value.length +
    " characters";

}

scriptBox.addEventListener(
  "input",
  updateCount
);

updateCount();


/* ============================================================
   SLIDERS
   ============================================================ */

rate.addEventListener(
  "input",
  function(){

    rateValue.textContent =
      Number(rate.value).toFixed(2) + "x";

  }
);


pitch.addEventListener(
  "input",
  function(){

    pitchValue.textContent =
      Number(pitch.value).toFixed(2);

  }
);


/* ============================================================
   BROWSER HINDI VOICES
   ============================================================ */

function loadBrowserVoices(){

  browserVoices =
    speechSynthesis.getVoices();

  voiceSelect.innerHTML = "";

  const hindi =
    browserVoices.filter(
      voice =>
        voice.lang &&
        voice.lang.toLowerCase().startsWith("hi")
    );


  if(hindi.length === 0){

    const option =
      document.createElement("option");

    option.textContent =
      "No Hindi browser voice found";

    voiceSelect.appendChild(option);

    return;

  }


  hindi.forEach(
    (voice,index)=>{

      const option =
        document.createElement("option");

      option.value =
        index;

      option.textContent =
        voice.name +
        " — " +
        voice.lang;

      voiceSelect.appendChild(option);

    }
  );


  status.textContent =
    hindi.length +
    " Hindi browser voice(s) available.";

}

speechSynthesis.onvoiceschanged =
  loadBrowserVoices;

loadBrowserVoices();


/* ============================================================
   VOICE CARDS
   ============================================================ */

document.querySelectorAll(".voice")
.forEach(card => {

  card.addEventListener(
    "click",
    function(){

      document
        .querySelectorAll(".voice")
        .forEach(
          x =>
            x.classList.remove("selected")
        );

      card.classList.add("selected");

      selectedGender =
        card.dataset.gender;

      status.textContent =
        card.dataset.name +
        " selected.";

    }
  );

});


/* ============================================================
   BROWSER PREVIEW
   ============================================================ */

function browserPreview(){

  const text =
    scriptBox.value.trim();

  if(!text){

    status.textContent =
      "Please enter Hindi text.";

    return;

  }


  const hindi =
    browserVoices.filter(
      voice =>
        voice.lang &&
        voice.lang.toLowerCase()
          .startsWith("hi")
    );


  if(!hindi.length){

    status.textContent =
      "No Hindi browser voice is available.";

    return;

  }


  let selected =
    hindi[
      Number(voiceSelect.value) || 0
    ];


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.voice =
    selected;

  utterance.lang =
    language.value;

  utterance.rate =
    Number(rate.value);

  utt
