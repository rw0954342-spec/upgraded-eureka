<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hindi Voice AI Studio</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #070b14;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      width: 230px;
      min-height: 100vh;
      background: #090e19;
      border-right: 1px solid #202b40;
      padding: 22px 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(
        135deg,
        #22d3ee,
        #8b5cf6
      );
    }

    .menu-title {
      color: #64748b;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      margin: 20px 10px 8px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .menu-item {
      border: none;
      background: transparent;
      color: #aebbd0;
      text-align: left;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .menu-item:hover,
    .menu-item.active {
      background: #172238;
      color: #ffffff;
    }

    /* ================= MAIN ================= */

    .main {
      flex: 1;
      min-width: 0;
    }

    .topbar {
      height: 70px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      padding: 0 25px;
      border-bottom: 1px solid #202b40;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: bold;
      background: linear-gradient(
        135deg,
        #22d3ee,
        #8b5cf6
      );
    }

    .content {
      width: 100%;
      max-width: 1400px;
      margin: auto;
      padding: 25px;
    }

    /* ================= WORKSPACE ================= */

    .workspace {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        360px;
      gap: 20px;
    }

    .card {
      background: #0d1524;
      border: 1px solid #233049;
      border-radius: 18px;
      padding: 20px;
    }

    .page-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .page-title h1 {
      font-size: 25px;
    }

    .status-badge {
      color: #67e8f9;
      border: 1px solid #155e75;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 10px;
    }

    /* ================= SCRIPT ================= */

    .label-row {
      display: flex;
      justify-content: space-between;
      color: #aebbd0;
      font-size: 13px;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #33415d;
      outline: none;
      background: #080e19;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.6;
    }

    textarea:focus {
      border-color: #22d3ee;
    }

    .counter {
      color: #64748b;
      font-size: 11px;
      margin-top: 7px;
      text-align: right;
    }

    /* ================= CONTROLS ================= */

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px;
      margin-top: 20px;
    }

    .control label {
      display: block;
      color: #aebbd0;
      font-size: 13px;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #33415d;
      background: #080e19;
      color: #ffffff;
      outline: none;
    }

    /* ================= VOICES ================= */

    .section-heading {
      margin-top: 24px;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .voices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .voice-card {
      border: 1px solid #33415d;
      background: #0a111e;
      color: #ffffff;
      border-radius: 14px;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .voice-card:hover {
      transform: translateY(-2px);
      border-color: #526581;
    }

    .voice-card.selected {
      border-color: #22d3ee;
      background: #102438;
      box-shadow:
        0 0 20px
        rgba(34, 211, 238, 0.10);
    }

    .voice-icon {
      font-size: 30px;
      margin-bottom: 9px;
    }

    .voice-name {
      font-weight: 800;
      margin-bottom: 5px;
    }

    .voice-description {
      color: #8fa0b8;
      font-size: 12px;
      line-height: 1.5;
    }

    /* ================= BUTTONS ================= */

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    .button {
      border: none;
      padding: 14px;
      border-radius: 11px;
      color: #ffffff;
      font-weight: 800;
      cursor: pointer;
    }

    .generate-button {
      background:
        linear-gradient(
          135deg,
          #16a34a,
          #22c55e
        );
    }

    .stop-button {
      background:
        linear-gradient(
          135deg,
          #dc2626,
          #ef4444
        );
    }

    .preview-button {
      width: 100%;
      margin-top: 10px;
      background:
        linear-gradient(
          135deg,
          #2563eb,
          #7c3aed
        );
    }

    .button:active {
      transform: scale(0.98);
    }

    /* ================= OUTPUT ================= */

    .output-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .output-subtitle {
      color: #22d3ee;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .waveform {
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
      background: #080e19;
      border: 1px solid #233049;
      border-radius: 14px;
    }

    .wave-bar {
      width: 4px;
      height: 18px;
      border-radius: 5px;
      background:
        linear-gradient(
          #22d3ee,
          #8b5cf6
        );
    }

    .waveform.active .wave-bar {
      animation:
        wave 0.65s
        infinite alternate;
    }

    @keyframes wave {

      from {
        height: 12px;
      }

      to {
        height: 80px;
      }

    }

    .output-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #080e19;
      border: 1px solid #233049;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }

    .download-button {
      width: 100%;
      margin-top: 12px;
      border: none;
      padding: 13px;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 800;
      background:
        linear-gradient(
          135deg,
          #0891b2,
          #7c3aed
        );
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 900px) {

      .sidebar {
        display: none;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 600px) {

      .content {
        padding: 10px;
      }

      .card {
        padding: 15px;
      }

      .controls,
      .voices,
      .button-row {
        grid-template-columns: 1fr;
      }

      .page-title h1 {
        font-size: 21px;
      }

    }

  </style>
</head>


<body>

  <div class="app">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

      <div class="logo">

        <div class="logo-icon">
          ✦
        </div>

        VOICE.AI

      </div>


      <div class="menu-title">
        WORKSPACE
      </div>


      <div class="menu">

        <button class="menu-item active">
          ⌂ Home
        </button>

        <button class="menu-item">
          ◉ Voices
        </button>

        <button class="menu-item">
          ◈ Voice Cloning
        </button>

        <button class="menu-item">
          ▣ Projects
        </button>

        <button class="menu-item">
          ☆ Favorites
        </button>

      </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">


      <header class="topbar">

        <span>
          🔔
        </span>

        <div class="avatar">
          AI
        </div>

      </header>


      <div class="content">


        <div class="workspace">


          <!-- ================= GENERATOR ================= -->

          <section class="card">


            <div class="page-title">

              <h1>
                AI Voice Generator
              </h1>

              <span class="status-badge">
                READY
              </span>

            </div>


            <!-- SCRIPT -->

            <div class="label-row">

              <span>
                Hindi Script
              </span>

              <span>
                Voice language: Hindi
              </span>

            </div>


            <textarea
              id="script"
              placeholder="Enter your Hindi script here..."
            >नमस्ते! यह हमारी Hindi AI Voice testing है। आज हम एक छोटी सी testing कर रहे हैं। अगर आप सफल होना चाहते हैं, तो हर दिन कुछ नया सीखिए, अपनी skills को बेहतर बनाइए और अपने लक्ष्य की तरफ लगातार आगे बढ़ते रहिए।</textarea>


            <div
              class="counter"
              id="counter"
            >
              0 characters
            </div>


            <!-- CONTROLS -->

            <div class="controls">


              <div class="control">

                <label>
                  Language
                </label>

                <select>

                  <option>
                    Hindi (India)
                  </option>

                </select>

              </div>


              <div class="control">

                <label>
                  Output
                </label>

                <select>

                  <option>
                    Natural Voice
                  </option>

                </select>

              </div>


            </div>


            <!-- VOICES -->

            <h2 class="section-heading">
              Voice Selection
            </h2>


            <div class="voices">


              <button
                class="voice-card selected"
                id="maleVoice"
              >

                <div class="voice-icon">
                  👨🏻
                </div>

                <div class="voice-name">
                  Indian Male
                </div>

                <div class="voice-description">
                  Natural Indian Hindi male voice
                </div>

              </button>


              <button
                class="voice-card"
                id="femaleVoice"
              >

                <div class="voice-icon">
                  👩🏻
                </div>

                <div class="voice-name">
                  Indian Female
                </div>

                <div class="voice-description">
                  Natural Indian Hindi female voice
                </div>

              </button>


            </div>


            <!-- ACTIONS -->

            <div class="button-row">

              <button
                class="button generate-button"
                id="generateButton"
              >
                ▶ Generate Voice
              </button>


              <button
                class="button stop-button"
                id="stopButton"
              >
                ■ Stop
              </button>

            </div>


            <button
              class="button preview-button"
              id="previewButton"
            >
              🔊 Listen / Preview
            </button>


            <div
              class="output-message"
              id="status"
            >
              Ready. Enter your Hindi script
              and choose a voice.

            </div>


          </section>


          <!-- ================= OUTPUT ================= -->

          <aside class="card">


            <div class="output-title">
              Audio Output
            </div>


            <div class="output-subtitle">
              Voice Preview
            </div>


            <div
              class="waveform"
              id="waveform"
            >

              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>
              <div class="wave-bar"></div>

            </div>


            <div
              class="output-message"
              style="margin-top:15px;"
            >

              <strong>
                Audio Player
              </strong>

              <br><br>

              The audio player will be
              activated in the next step.

            </div>


            <button
              class="download-button"
              disabled
            >
              ⬇ Download MP3
            </button>


            <button
              class="download-button"
              disabled
            >
              ⬇ Download WAV
            </button>


          </aside>


        </div>

      </div>

    </main>

  </div>


  <!-- ================= BASIC TEST SCRIPT ================= -->

  <script>

    const script =
      document.getElementById("script");

    const counter =
      document.getElementById("counter");

    const status =
      document.getElementById("status");

    const waveform =
      document.getElementById("waveform");

    const maleVoice =
      document.getElementById("maleVoice");

    const femaleVoice =
      document.getElementById("femaleVoice");

    const previewButton =
      document.getElementById("previewButton");

    const stopButton =
      document.getElementById("stopButton");


    let selectedVoice =
      "male";


    /* Character Counter */

    function updateCounter() {

      counter.textContent =
        script.value.length +
        " characters";

    }

    script.addEventListener(
      "input",
      updateCounter
    );

    updateCounter();


    /* Voice Selection */

    maleVoice.addEventListener(
      "click",
      function() {

        selectedVoice = "male";

        maleVoice.classList.add(
          "selected"
        );

        femaleVoice.classList.remove(
          "selected"
        );

        status.textContent =
          "Indian Male selected. Ready for voice testing.";

      }
    );


    femaleVoice.addEventListener(
      "click",
      function() {

        selectedVoice = "female";

        femaleVoice.classList.add(
          "selected"
        );

        maleVoice.classList.remove(
          "selected"
        );

        status.textContent =
          "Indian Female selected. Ready for voice testing.";

      }
    );


    /*
      IMPORTANT:

      This first file intentionally does NOT
      contain the real AI TTS engine.

      We are keeping the foundation stable first.
      The voice engine will be added in the next
      numbered file.
    */


    previewButton.addEventListener(
      "click",
      function() {

        status.textContent =
          selectedVoice === "male"
          ? "Indian Male selected. Voice engine will be connected in the next step."
          : "Indian Female selected. Voice engine will be connected in the next step.";

      }
    );


    stopButton.addEventListener(
      "click",
      function() {

        if (
          "speechSynthesis"
          in window
        ) {

          speechSynthesis.cancel();

        }

        waveform.classList.remove(
          "active"
        );

        status.textContent =
          "Voice stopped.";

      }
    );


    document
      .getElementById("generateButton")
      .addEventListener(
        "click",
        function() {

          status.textContent =
            "Generator interface is ready. The real Hindi voice engine will be added safely in the next file.";

        }
      );

  </script>

</body>
  </html>
